[project]
name = "certivert"
description = ""
authors = []
telemetry = true
cache_dir = "./.cache"

[contracts.role-registry]
path = "contracts/role-registry.clar"
epoch = "latest"

[contracts.certificate-store]
path = "contracts/certificate-store.clar"
epoch = "latest"
depends_on = ["role-registry"]

[contracts.certificate-governance-v3]
path = "contracts/certificate-governance.clar"
epoch = "latest"
depends_on = []

# Check-checker settings:
# trusted_sender: if true, inputs are trusted after tx_sender has been checked.
# trusted_caller: if true, inputs are trusted after contract-caller has been checked.
# callee_filter: if true, untrusted data may be passed into a private function without a
# warning, if it gets checked inside. This check will also propagate up to the
# caller.
# More informations: https://www.hiro.so/blog/new-safety-checks-in-clarinet

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

[accounts.deployer]
mnemonic = "twice kind fence tip hidden tilt action fragile skin nothing glory cousin green tomorrow spring wrist shed math olympic multiply hip blue scout claw"